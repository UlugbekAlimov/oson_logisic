<section id="about" class="px-6 py-16 md:px-10 md:py-20 lg:px-20">
  <div class="grid gap-10 lg:grid-cols-[1.1fr_0.9fr]">
    <div class="reveal rounded-3xl border border-[#d6c08a]/30 bg-white p-8 shadow-xl" style="--delay: 0.1s;">
      <p class="text-xs font-semibold uppercase tracking-[0.35em] text-[#b08b4f]">{{ i18n.t('about.label') }}</p>
      <h2 class="mt-4 text-3xl font-semibold text-[#0b2b24] md:text-4xl">{{ i18n.t('about.title') }}</h2>
      <p class="mt-4 text-base font-semibold text-[#0b2b24]/80">
        {{ i18n.t('about.lead') }}
      </p>
      <p class="mt-4 text-sm leading-relaxed text-[#0b2b24]/70">
        {{ i18n.t('about.text1') }}
      </p>
      <p class="mt-4 text-sm leading-relaxed text-[#0b2b24]/70">
        {{ i18n.t('about.text2') }}
      </p>
    </div>
    <div class="reveal relative min-h-[320px] overflow-hidden rounded-3xl border border-[#d6c08a]/40" style="--delay: 0.2s;">
      <img
        class="absolute inset-0 h-full w-full object-cover"
        src="about-1200.webp"
        srcset="about-800.webp 800w, about-1200.webp 1200w"
        sizes="(min-width: 1024px) 40vw, 90vw"
        width="1200"
        height="800"
        loading="lazy"
        decoding="async"
        alt=""
        aria-hidden="true"
      />
      <div class="absolute inset-0 bg-gradient-to-br from-[#0b2b24]/20 to-[#0b2b24]/75"></div>
      <div class="relative z-10 flex h-full items-end p-6">
        <div class="rounded-2xl bg-[#0b2b24]/70 p-4 text-sm text-[#f4f1e8]">
          {{ i18n.t('about.caption') }}
        </div>
      </div>
    </div>
  </div>
</section>
