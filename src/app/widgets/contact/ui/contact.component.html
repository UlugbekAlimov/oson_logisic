<section id="contact" class="bg-[#12362d] px-6 py-16 text-[#f4f1e8] md:px-10 md:py-20 lg:px-20">
  <div class="grid gap-8 md:grid-cols-3">
    <div>
      <p class="text-xs font-semibold uppercase tracking-[0.35em] text-[#d6c08a]">{{ i18n.t('contact.label') }}</p>
      <h2 class="mt-4 text-3xl font-semibold">{{ i18n.t('contact.title') }}</h2>
      <p class="mt-4 text-sm text-[#f4f1e8]/75">{{ i18n.t('contact.subtitle') }}</p>
    </div>
    <div class="space-y-3 text-sm">

      <a href="tel:+442079460900" class="block transition hover:text-white">+44 20 7946 0900</a>
    </div>
    <div class="space-y-3 text-sm">
      <p class="font-semibold text-[#d6c08a]">{{ i18n.t('contact.email') }}</p>
      <a href="mailto:dispatch@logisticcrest.com" class="block transition hover:text-white">dispatch@logisticcrest.com</a>
      <p class="mt-6 font-semibold text-[#d6c08a]">{{ i18n.t('contact.address') }}</p>
      <p class="text-[#f4f1e8]/75">{{ i18n.t('contact.addressValue') }}</p>
